name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The Rust core carries the great majority of this project's tests, and
  # until now none of them ran in CI — only the Python facade was covered.
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --verbose

      # Both are advertised in Cargo.toml and both were broken — their module
      # files did not exist. Build them so that cannot regress unnoticed.
      - name: Test (rust-support)
        run: cargo test --features rust-support --verbose

      - name: Test (cpp-support)
        run: cargo test --features cpp-support --verbose

  python:
    name: Python facade
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: pip install --upgrade pip maturin

      - name: Install library with dev deps
        run: pip install .[dev]

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=arithma --cov-report=term-missing
