[package]
name = "arithma_core"
version = "2.0.4"
edition = "2021"
# Not decoration on crates.io: without it, cargo resolves for a user on an older
# toolchain and the build fails somewhere in a dependency with no mention of
# this crate.
#
# 1.82 is what the code actually needs, and the driver is easy to miss --
# `Option::is_none_or`, stabilised in 1.82, used at `pyfacade/geometry.rs:143`
# and `unit.rs:473`. Both are inside `debug_assert!`, so they never run in a
# release build, but they still have to compile. `let ... else` (1.65) is the
# newest *language* feature here, and guessing from that alone would have
# declared 1.74 and broken the build for anyone who believed it.
rust-version = "1.82"
description = "Symbolic mathematics engine: expressions, calculus, linear algebra, units and constants"
license-file = "LICENSE"
repository = "https://github.com/andrewkwatts-maker/Arithma"
homepage = "https://github.com/andrewkwatts-maker/Arithma"
documentation = "https://docs.rs/arithma_core"
readme = "../../README.md"
keywords = ["symbolic", "mathematics", "cas", "calculus", "units"]
# crates.io accepts at most five keywords and these categories exactly; both
# lists are validated at publish time, so a typo is a failed upload.
categories = ["mathematics", "science", "algorithms"]
# The published crate is the crate. The wheel, the Python package and the
# 1.1 MB of benchmark output do not belong in a `cargo add` for anyone.
exclude = ["/benches/target", "*.pdb"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# `python` enables the PyO3 bindings and links libpython, so the test binary
# runs. `extension-module` additionally tells PyO3 not to link libpython,
# which is required to build a wheel but makes any test binary unloadable.
#
# These were one feature. That is why `cargo test --features python` appears
# nowhere in CI: it could not link, so every `#[cfg(test)]` test inside
# `pyfacade/` was written and then never executed anywhere.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
cpp-support = []
rust-support = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
thiserror = "1.0"
pyo3 = { version = "0.22", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# Benchmarks live in benches/hot_paths.rs. `harness = false` hands the binary
# to criterion instead of libtest.
[[bench]]
name = "hot_paths"
harness = false
